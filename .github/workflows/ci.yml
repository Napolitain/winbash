name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install uutils coreutils
        shell: pwsh
        run: |
          cargo install coreutils --locked
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $cargoBin = Join-Path $cargoHome "bin"
          "WINBASH_UUTILS_DIR=$cargoBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINBASH_COREUTILS=$(Join-Path $cargoBin 'coreutils.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
